    <text x="437" y="547" font-size="20" font-weight="700" stroke="none">Asterisco de 20 puntas</text>
    <g transform="translate(600 635)" stroke="#cf63cf" stroke-width="2.7">
      <path d="M-68 0 H68 M-64.6 -21.1 L64.6 21.1 M-55.1 -40 L55.1 40 M-40 -55.1 L40 55.1 M-21.1 -64.6 L21.1 64.6 M-21.1 64.6 L21.1 -64.6 M-40 55.1 L40 -55.1 M-55.1 40 L55.1 -40 M-64.6 21.1 L64.6 -21.1 M0 -68 V68"/>
