<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Las pestañas Código, Disfraces y Sonidos de Scratch</title>
  <desc id="desc">Tres tarjetas describen para qué sirve cada pestaña y recuerdan que los objetos y el escenario se seleccionan en otra zona del editor.</desc>
  <rect width="1200" height="420" rx="24" fill="#f3f6fb"/>
  <text x="38" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18243a">Tres pestañas para trabajar con cada objeto</text>
  <rect x="35" y="82" width="350" height="245" rx="18" fill="#ffffff" stroke="#ccd5e2" stroke-width="2"/>
  <rect x="35" y="82" width="350" height="58" rx="18" fill="#4c97ff"/>
  <text x="70" y="120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">CÓDIGO</text>
  <rect x="67" y="166" width="230" height="38" rx="11" fill="#ffbf00"/>
  <text x="80" y="191" font-family="Arial,sans-serif" font-size="15" fill="#26354a">al presionar bandera verde</text>
  <rect x="67" y="211" width="155" height="38" rx="11" fill="#4c97ff"/>
  <text x="80" y="236" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">mover 10 pasos</text>
  <text x="67" y="286" font-family="Arial,sans-serif" font-size="17" fill="#44546a">Une bloques para dar instrucciones.</text>
  <rect x="425" y="82" width="350" height="245" rx="18" fill="#ffffff" stroke="#ccd5e2" stroke-width="2"/>
  <rect x="425" y="82" width="350" height="58" rx="18" fill="#9966ff"/>
  <text x="460" y="120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">DISFRACES</text>
  <circle cx="520" cy="210" r="27" fill="#ffab19"/>
  <rect x="498" y="236" width="44" height="43" rx="15" fill="#4c97ff"/>
  <line x1="506" y1="273" x2="496" y2="292" stroke="#26354a" stroke-width="6"/>
  <line x1="534" y1="273" x2="544" y2="292" stroke="#26354a" stroke-width="6"/>
  <path d="M625 222 H680" stroke="#52647a" stroke-width="4"/>
  <polygon points="681,212 699,222 681,232" fill="#52647a"/>
  <circle cx="720" cy="210" r="27" fill="#ffab19"/>
  <rect x="698" y="236" width="44" height="43" rx="15" fill="#59c059"/>
  <line x1="706" y1="273" x2="690" y2="292" stroke="#26354a" stroke-width="6"/>
  <line x1="734" y1="273" x2="751" y2="292" stroke="#26354a" stroke-width="6"/>
  <text x="458" y="310" font-family="Arial,sans-serif" font-size="17" fill="#44546a">Cambia o edita el aspecto del objeto.</text>
  <rect x="815" y="82" width="350" height="245" rx="18" fill="#ffffff" stroke="#ccd5e2" stroke-width="2"/>
  <rect x="815" y="82" width="350" height="58" rx="18" fill="#cf63cf"/>
  <text x="850" y="120" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">SONIDOS</text>
  <path d="M885 200 h24 l30 -24 v80 l-30 -24 h-24 z" fill="#cf63cf"/>
  <path d="M954 191 q28 24 0 48 M969 179 q44 36 0 72" fill="none" stroke="#cf63cf" stroke-width="7" stroke-linecap="round"/>
  <rect x="1020" y="193" width="96" height="36" rx="10" fill="#f3e8f7"/>
  <text x="1035" y="217" font-family="Arial,sans-serif" font-size="15" fill="#6f3473">sonido</text>
  <text x="848" y="286" font-family="Arial,sans-serif" font-size="17" fill="#44546a">Añade, escucha o edita sonidos.</text>
  <rect x="35" y="346" width="1130" height="48" rx="12" fill="#e4edf7"/>
  <text x="57" y="377" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#26354a">Los objetos y el escenario se eligen en la lista de la parte inferior derecha; no son una cuarta pestaña.</text>
</svg>
